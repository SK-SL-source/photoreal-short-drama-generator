display-name-zh: 仿真人短劇成片
version: 2.0.0
tag-en: "Short Drama / Creative Generation"
tag-cn: "短剧漫剧 / 创作生成"
complete-tags-en:
  - "Short Drama / Creative Generation"
complete-tags-cn:
  - "短剧漫剧 / 创作生成"
summary-en: "Turns a short-drama script into a photoreal episode on local ComfyUI (MiniMax H3 + Qwen-Image 2.1) in five stations: script and event table; character boards, scene cards, scene relation tables and voices compiled from templates against the user's five reference images; shot table, shot cards and one first-frame image per shot checked by an image gate; H3 prompts linted and queued; measured clip review; edit and final cut. One gate per station, silence means approved, and generation only uses files in the approved folder."
summary-cn: "在本機 ComfyUI（MiniMax H3＋Qwen-Image 2.1）照五站把短劇劇本做成仿真人成片：劇本與事件表；照使用者五張基準圖、由母版編譯的角色板、場景卡、場景關係表與音色；鏡頭表、分鏡卡和每鏡一張第 0 幀圖（圖像檢查器把關）；H3 提示詞過 lint 後整批排佇列生成、量測驗片；剪接成片。一站一關、沒回視為過，送件只能掛已核可資料夾裡的檔。"
desc-en: "For creators producing photoreal short dramas on a local MiniMax H3 setup who need identities, wardrobe, voices, actions and dialogue under control. Provide a script and five reference images; the Skill writes the story and event table, compiles character boards and scene cards from fixed templates (style, beauty, wardrobe system, layout) with an ugly-wardrobe gate, builds the shot table and cards, makes one first-frame image per shot checked against the shot table, compiles and lints H3 prompts, queues clips that only reference approved files, measures every clip into a review packet, and cuts the episode. Every station is delivered as one batch; the user replies only to the items that need changes. Not for single clips, simple edits or narration-led productions."
desc-cn: "面向在本機 MiniMax H3 製作仿真人短劇、需要穩定控制角色身分、服裝造型、聲音、動作與台詞的創作者。使用者提供劇本和五張基準圖；技能寫故事與事件表，用固定母版（畫風、人物審美、服裝造型系統、版型）編譯角色板和場景卡並過醜衣／醜景 Gate，建鏡頭表與分鏡卡，每鏡一張第 0 幀圖並對鏡頭表檢查，編譯並 lint H3 提示詞，只掛已核可檔的佇列生成，每條片段量測成驗片包，最後剪成成片。每一站整批交，使用者只回要改的項目。不適用單一片段、簡單剪輯或旁白主導的製作。"
author-en: "photoreal-short-drama-generator contributors"
author-cn: "photoreal-short-drama-generator contributors"
source: community
structured-info:
  zh-CN:
    summary: 在本機 MiniMax H3＋Qwen-Image 2.1 照五站把短劇劇本做成仿真人成片：畫風照使用者五張基準圖定死，卡片由母版編譯，每鏡一張第 0 幀圖過檢查器，送件只掛已核可檔。
    best-for:
      - 仿真人短劇
      - 角色板與場景卡
      - 台詞口型
    how-to-use: 先跑開工檢查，給劇本和五張基準圖；每一站做完整批交給你，你只回要改的項目，沒回視為過；每站只有一張生成授權卡。
    outputs: 劇本與事件表、角色板與裁圖、場景卡、場景關係表、音色、鏡頭表與分鏡卡、每鏡第 0 幀圖、H3 提示詞、片段與驗片包、粗剪細剪成片與無配樂母版。
  en-US:
    summary: Turn a short-drama script into a photoreal episode on local MiniMax H3 + Qwen-Image 2.1 in five stations, with the look fixed by the user's five reference images, cards compiled from templates, one gated first-frame image per shot, and generation that only uses approved files.
    best-for:
      - Photoreal Short Drama
      - Character Boards and Scene Cards
      - Dialogue Lip Sync
    how-to-use: Run the setup check, provide a script and five reference images; each station is delivered as one batch, you reply only to what needs changing, silence means approved, and each station has a single generation-authorization card.
    outputs: Script and event table, character boards and crops, scene cards, scene relation tables, voices, shot table and cards, one first-frame image per shot, H3 prompts, clips with review packets, rough cut, fine cut, final cut and a no-music master.

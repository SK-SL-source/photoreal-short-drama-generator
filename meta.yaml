summary-en: "Turns a short-drama idea or script into a photoreal episode, in a 3D or live-action look, on local ComfyUI (MiniMax H3) through five stations: script and event table, visual bible and purpose-driven storyboard, first frames, compiled and linted H3 prompts, queued generation and measured clip review, sound post and the final cut."
summary-cn: "在本機 ComfyUI（MiniMax H3）照五站把短劇創意或劇本做成仿真人成片（寫實 3D 或實拍電影感）：劇本與事件表、視覺聖經與有敘事目的的分鏡、首幀、編譯並通過 lint 的 H3 提示詞、佇列送件與量測驗片、聲音後製與成片。"
desc-en: "For creators producing photoreal short dramas, in a 3D or live-action look, on a local MiniMax H3 setup who need identities, voices, actions and dialogue under control. Provide a story idea or a finished script, then choose aspect ratio, length, music mode, reference-image source and style. The Skill writes or imports the story and final lines, breaks it into an event table, decides which shots each event needs and what each must deliver, and sets a visual bible where every lighting, color, atmosphere, set-dressing and background decision is made on purpose. Each shot card states its narrative beat and expression point, camera, lens, an action card with a time budget, where its first frame comes from (the previous shot's last frame, an adjacent approved frame, or a new keyframe) and the continuity handoff at each cut; a shot whose order one generation cannot hold is split into two segments joined by a crossfade. Prompts are compiled from the approved cards and linted before any render. Clips render on the PDD 8-step profile through a queue ledger that tracks every job, relays first frames, and holds a relay when the source clip shows a cut or a leaked reference sheet. Every clip is measured (first frame, cuts, camera drift, duplicate frames, dialogue timeline, regional motion, loudness, picture and sound length) into a review packet before the user approves it item by item in chat, and rework stays within classified limits. Inner voice, narration and music cues are produced in post, assembled and mixed through a rough cut and a fine cut into the final cut, with a no-music master kept every time. The Skill carries a default rules core, a prompt lint and a setup check; local rule files and machine settings override the defaults. Not for single clips, simple edits or narration-led productions."
desc-cn: "面向在本機 MiniMax H3 製作仿真人短劇（寫實 3D 或實拍電影感）、需要穩定控制角色身分、聲音、動作與台詞的創作者。使用者提供故事創意或完成的劇本，選擇畫幅、長度、配樂模式、參考圖來源與畫風。技能會撰寫或匯入故事與台詞，拆成事件表，判斷每個事件要幾鏡、每一鏡要交付什麼，並建立視覺聖經，讓光、色、空氣、陳設、背景生活每一項都是刻意的決定。每張分鏡卡寫明拍與表達點、鏡頭、焦距、含時間預算的動作卡、首幀從哪裡來（上一鏡的最後一格、相鄰已核可的畫面或新合成的首幀），以及每個切點的連戲交接；一次生成控制不住先後順序的鏡，拆成兩段再交叉淡化接起來。提示詞從核可的分鏡卡編譯，算圖前先跑 lint；片段用 PDD 8 步正式檔位，經由佇列帳本送件：每一條都追蹤到完成，首幀自動接力，來源片有切鏡或漏出角色卡時先停下來等人看。每條片段先量測（第 0 幀、片中切鏡、鏡頭位移、重複幀、台詞時間軸、分區動量、響度、聲畫長度），產出驗片包，再由使用者在聊天裡逐條核可；重做依類型有上限。心聲、旁白與分段配樂在後製完成，經過粗剪、細剪混成成片，每次都另存無配樂母版。技能內附預設的規則核心、提示詞 lint 和開工檢查；在地規則檔和本機設定可以覆寫。不適用單一片段、簡單剪輯或旁白主導的製作。"
author-en: "photoreal-short-drama-generator contributors"
author-cn: "photoreal-short-drama-generator contributors"

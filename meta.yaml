structured-info:
  zh-CN:
    summary: 在本機 MiniMax H3 照五站把短劇創意或劇本做成仿真人成片：美術方向逐案鎖定，每一鏡都有敘事目的，Animatic 核可後才鎖定製作計畫，提示詞先過 lint，正式 H3 過量產關卡才送、片段先量測再逐條驗收。
    best-for:
      - 仿真人短劇
      - 分鏡與事件表
      - 台詞口型
    how-to-use: 先跑開工檢查，再提供創意或劇本，選擇畫幅、長度、配樂模式、參考圖來源與畫風後開始；第 2 站會停下來請你鎖定美術方向、核可 Animatic、說「鎖定」。
    outputs: 劇本與事件表、視覺聖經與 Style Master、角色卡、場景卡、音色資產、鏡頭表與分鏡卡、分鏡參考圖與首幀、Animatic、量產關卡、H3 提示詞、片段與驗片包、粗剪、細剪、成片與無配樂母版。
  en-US:
    summary: Turn a short-drama idea or script into a photoreal episode on local MiniMax H3 in five stations, with the art direction locked per project, a narrative purpose for every shot, the production plan locked only after an approved animatic, linted prompts, formal H3 clips sent only through the production gate, and measured clips approved one by one.
    best-for:
      - Photoreal Short Drama
      - Storyboard and Event Table
      - Dialogue Lip Sync
    how-to-use: Run the setup check, then provide an idea or a script and choose aspect ratio, length, music mode, the reference-image source and the style to begin; station 2 stops for you to lock the art direction, approve the animatic and say lock.
    outputs: Script and event table, visual bible and Style Master, character and scene cards, voice assets, shot table and cards, storyboard references and first frames, animatic, production gate record, H3 prompts, clips with review packets, rough and fine cuts, the final cut and a no-music master.

structured-info:
  zh-CN:
    summary: 在本機 MiniMax H3 照五站把短劇創意或劇本做成仿真人成片，每一鏡都有敘事目的，提示詞先過 lint、片段先量測再逐條驗收。
    best-for:
      - 仿真人短劇
      - 分鏡與事件表
      - 台詞口型
    how-to-use: 先跑開工檢查，再提供創意或劇本，選擇畫幅、長度、配樂模式、參考圖來源與畫風後開始。
    outputs: 劇本與事件表、視覺聖經、角色卡、場景卡、音色檔、鏡頭表與分鏡卡、首幀、H3 提示詞、片段與驗片包、粗剪、細剪、成片與無配樂母版。
  en-US:
    summary: Turn a short-drama idea or script into a photoreal episode on local MiniMax H3 in five stations, with a narrative purpose for every shot, linted prompts and measured clips approved one by one.
    best-for:
      - Photoreal Short Drama
      - Storyboard and Event Table
      - Dialogue Lip Sync
    how-to-use: Run the setup check, then provide an idea or a script and choose aspect ratio, length, music mode, the reference-image source and the style to begin.
    outputs: Script and event table, visual bible, character and scene cards, voice files, shot table and cards, first frames, H3 prompts, clips with review packets, rough and fine cuts, the final cut and a no-music master.
